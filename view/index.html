        container.appendChild(outer);
    }

    // The element head, read wherever its properties sit rather than only
    // as a leading run: the spec puts them first, and tolerating any order
    // costs nothing.
    function dclgHead(node) {
        const head = { thread: null, xref: null, href: null, label: null, caption: null, description: '', furniture: false };
        Array.prototype.forEach.call(node.children, function (c) {
            switch (c.localName) {
                case 'thread':      head.thread = c.getAttribute('thread_id'); break;
                case 'xref':        head.xref = c.getAttribute('thread_id'); break;
                case 'href':        head.href = c.getAttribute('uri'); break;
                case 'label':       head.label = c.getAttribute('value'); break;
                case 'caption':     head.caption = c; break;
                case 'description': head.description = dclgText(c); break;
                case 'layer': {
                    const layer = c.getAttribute('value');
                    head.furniture = layer === 'furniture' || layer === 'background';
                    break;
                }
            }
        });
        return head;
    }

    function dclgBody(node) {
        return Array.prototype.filter.call(node.childNodes, function (n) {
            return !(n.nodeType === 1 && DCLG_PROPERTIES.has(n.localName));
        });
    }

    function dclgBuild(tag, node, head, body, ctx, inline) {
        switch (tag) {
            case 'heading':
            case 'field_heading': {
                // A field heading is scoped to the form it sits in, and a
                // form sits under the document's own headings, so its
                // levels start two below.
                const depth = parseInt(node.getAttribute('level'), 10) || 1;
                const level = Math.min(tag === 'heading' ? depth : depth + 2, 6);
                const e = el(inline ? 'span' : 'h' + level, 'dclg-' + tag);
                dclgFlow(e, body, head, ctx);
                return e;
            }
            case 'code': {
                if (inline) {
                    const e = el('code');
                    dclgFlow(e, body, head, ctx);
                    return e;
                }
                const pre = el('pre', 'dclg-code');
                if (head.label && head.label !== 'undefined') pre.setAttribute('data-label', head.label);
                const e = el('code');
                dclgFlow(e, body, head, ctx);
                pre.appendChild(e);
                return pre;
            }
            case 'formula': {
                const e = el(inline ? 'span' : 'div', 'dclg-formula');
                dclgFlow(e, body, head, ctx);
                return e;
            }
            case 'picture':
                return dclgPicture(head, body, ctx, inline);
            case 'list': {
                const list = el(node.getAttribute('class') === 'ordered' ? 'ol' : 'ul', 'dclg-list');
                dclgListItems(body, list, ctx);
                return list;
            }
            case 'table':
            case 'index':
            case 'tabular':
                return dclgTable(body, el('table', 'dclg-table'), ctx);
            case 'group':
            case 'field_region':
            case 'field_item': {
                const e = el(inline ? 'span' : 'div', 'dclg-' + tag);
                dclgNodes(body, e, ctx, inline);
                return e;
            }
            case 'text':
            case 'footnote':
            case 'page_header':
            case 'page_footer':
            case 'marker':
            case 'key':
            case 'value':
            case 'hint':
            case 'caption': {
                const e = el(inline ? 'span' : 'p', 'dclg-' + tag);
                if (tag === 'value' && node.getAttribute('class') === 'fillable') e.classList.add('is-fillable');
                dclgFlow(e, body, head, ctx);
                return e;
            }
            default: {
                // Custom vocabulary or a newer spec: render what is inside
                // it in the same context, and claim nothing about it.
                const e = el(inline ? 'span' : 'div');
                dclgNodes(body, e, ctx, inline);
                return e;
            }
        }
    }

    // A second fragment of a thread. Returns false for the kinds that have
    // nothing to append into, so the caller renders it as its own block.
    function dclgContinue(tag, target, head, body, ctx) {
        switch (tag) {
            case 'list':
                dclgListItems(body, target, ctx);
                return true;
            case 'table':
            case 'index':
                dclgTable(body, target, ctx);
                return true;
            case 'text':
            case 'heading':
            case 'footnote':
            case 'page_header':
            case 'page_footer':
            case 'key':
            case 'value':
            case 'hint':
                target.appendChild(document.createTextNode(' '));
                dclgFlow(target, body, head, ctx);
                return true;
            default:
                return false;
        }
    }

    // The frame around a block: its caption, placed where a reader expects
    // it, and for a table the scroll container the page needs.
    function dclgFrame(e, tag, head, ctx) {
        switch (tag) {
            case 'picture':
                if (head.caption) e.appendChild(dclgCaption(head.caption, 'figcaption', ctx));
                return e;
            case 'table':
            case 'index': {
                if (head.caption) e.insertBefore(dclgCaption(head.caption, 'caption', ctx), e.firstChild);
                const wrap = el('div', 'dclg-table-wrap');
                wrap.appendChild(e);
                return wrap;
            }
            case 'code':
            case 'formula': {
                if (!head.caption) return e;
                const fig = el('figure', 'dclg-figure');
                fig.appendChild(e);
                fig.appendChild(dclgCaption(head.caption, 'figcaption', ctx));
                return fig;
            }
            default: {
                if (!head.caption) return e;
                const fig = el('figure', 'dclg-figure');
                fig.appendChild(dclgCaption(head.caption, 'figcaption', ctx));
                fig.appendChild(e);
                return fig;
            }
        }
    }

    function dclgCaption(captionNode, tagName, ctx) {
        const e = el(tagName);
        dclgFlow(e, dclgBody(captionNode), dclgHead(captionNode), ctx);
        return e;
    }

    // Inline flow of a body into an element, through the link its head
    // asks for: an <href> becomes a real link when it is http(s) or
    // mailto, an <xref> an in-page link to the thread it names.
    function dclgFlow(e, body, head, ctx) {
        dclgNodes(body, dclgLinkWrap(e, head), ctx, true);
    }

    function dclgLinkWrap(e, head) {
        let href = null;
        let external = false;
        if (head.xref) {
            href = '#' + dclgThreadId(head.xref);
        } else if (head.href && DCLG_LINK_SCHEME.test(head.href)) {
            href = head.href;
            external = true;
        }
        if (!href) return e;
        const a = el('a');
        a.href = href;
        if (external) {
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
        }
        e.appendChild(a);
        return a;
    }

    function dclgThreadId(id) {
        return 'dclg-thread-' + String(id).replace(/[^\w-]/g, '_');
    }

    // A picture is its image. The text the document found inside it, and
    // the description, are kept as the fallback that shows when there is
    // no image to show — no <src>, or one that will not load. A chart's
    // structured data (<tabular>) is rendered as a table under the image,
    // since the numbers are what a reader would want from a chart.
    function dclgPicture(head, body, ctx, inline) {
        const fig = el(inline ? 'span' : 'figure', 'dclg-picture');
        const link = dclgLinkWrap(fig, head);
        let src = null;
        let tabular = null;
        const rest = [];
        body.forEach(function (n) {
            if (n.nodeType === 1 && n.localName === 'src') src = dclgImageSource(n.getAttribute('uri'));
            else if (n.nodeType === 1 && n.localName === 'tabular') tabular = n;
            else rest.push(n);
        });

        if (src) {
            const img = el('img');
            img.src = src;
            img.alt = head.description || (head.caption ? dclgText(head.caption) : '');
            img.addEventListener('error', function () { fig.classList.add('no-image'); });
            link.appendChild(img);
        } else {
            fig.classList.add('no-image');
        }

        if (!inline) {
            const placeholder = el('div', 'dclg-picture-placeholder');
            placeholder.textContent = 'Picture' +
                (head.label && head.label !== 'undefined' ? ': ' + head.label.replace(/_/g, ' ') : '') +
                (head.description ? ' — ' + head.description : '');
            fig.appendChild(placeholder);
        }
        if (rest.some(function (n) { return n.nodeType === 1 || n.nodeValue.trim(); })) {
            const t = el(inline ? 'span' : 'div', 'dclg-picture-text');
            dclgNodes(rest, t, ctx, inline);
            fig.appendChild(t);
        }
        if (tabular) {
            const wrap = el('div', 'dclg-table-wrap');
            wrap.appendChild(dclgTable(dclgBody(tabular), el('table', 'dclg-table'), ctx));
            fig.appendChild(wrap);
        }
        return fig;
    }

    // An image source earns an <img> when it is an http(s) URL (the page's
    // CSP decides whether it loads), a data:image URI, or a relative path,
    // which resolves against the document the way a picture's assets/
    // folder sits beside the file. Any other scheme is dropped.
    function dclgImageSource(uri) {
        if (!uri) return null;
        if (DCLG_IMAGE_SCHEME.test(uri)) return uri;
        if (DCLG_ANY_SCHEME.test(uri)) return null;
        try {
            return new URL(uri, fetchUrl ? new URL(fetchUrl, location.href) : location.href).href;
        } catch (e) {
            return null;
        }
    }

    // List items: an <ldiv> opens each one and may carry the printed
    // marker; whatever follows until the next <ldiv> is the item, raw text
    // included. Every item gets a marker cell so a continuation fragment
    // lines up with the first, and the list shows them only once one
    // item has actually supplied a marker.
    function dclgListItems(body, list, ctx) {
        let content = null;
        body.forEach(function (n) {
            if (n.nodeType === 1 && n.localName === 'ldiv') {
                content = dclgListItem(list, Array.prototype.find.call(n.children, function (c) {
                    return c.localName === 'marker';
                }), ctx);
                return;
            }
            if (!content) {
                if (n.nodeType !== 1 && !n.nodeValue.trim()) return;
                content = dclgListItem(list, null, ctx);   // content before any <ldiv>: tolerated
            }
            dclgNodes([n], content, ctx, false);
        });
    }

    function dclgListItem(list, markerNode, ctx) {
        const li = el('li');
        const marker = el('span', 'dclg-marker');
        if (markerNode) {
            dclgFlow(marker, dclgBody(markerNode), dclgHead(markerNode), ctx);
            list.classList.add('has-markers');
        }
        li.appendChild(marker);
        const content = el('div', 'dclg-item');
        li.appendChild(content);
        list.appendChild(li);
        return content;
    }

    // OTSL: a table is a stream of cell tokens, each opening a cell that
    // owns the content after it, with <nl/> closing the row. The merge
    // tokens (<lcel/>, <ucel/>, <xcel/>) are positions that belong to the
    // cell to their left or above, so the grid is built first as a grid of
    // owners, and a cell's colspan and rowspan fall out of the positions it
    // owns. Leading rows made only of column headers go in <thead>; rows of
    // a continuation fragment are appended to the body of the table the
    // thread started.
    function dclgTable(body, table, ctx) {
        const rows = [];
        let row = [];
        let cell = null;
        body.forEach(function (n) {
            if (n.nodeType === 1) {
                const t = n.localName;
                if (DCLG_CELLS.has(t)) {
                    cell = { kind: t, nodes: [], r: rows.length, c: row.length };
                    row.push(cell);
                    return;
                }
                if (t === 'lcel' || t === 'ucel' || t === 'xcel') {
                    const owner = t === 'lcel' ? row[row.length - 1] : (rows[rows.length - 1] || [])[row.length];
                    cell = owner || { kind: 'ecel', nodes: [], r: rows.length, c: row.length };
                    row.push(cell);
                    return;
                }
                if (t === 'nl') {
                    rows.push(row);
                    row = [];
                    cell = null;
                    return;
                }
            } else if (!n.nodeValue.trim()) {
                return;
            }
            if (!cell) {   // content before any token: tolerated as a cell
                cell = { kind: 'fcel', nodes: [], r: rows.length, c: row.length };
                row.push(cell);
            }
            cell.nodes.push(n);
        });
        if (row.length) rows.push(row);

        rows.forEach(function (row, r) {
            row.forEach(function (owner, c) {
                owner.rEnd = Math.max(owner.rEnd === undefined ? owner.r : owner.rEnd, r);
                owner.cEnd = Math.max(owner.cEnd === undefined ? owner.c : owner.cEnd, c);
            });
        });

        const continuing = table.tBodies.length > 0;
        let headerRows = 0;
        if (!continuing) {
            while (headerRows < rows.length && rows[headerRows].every(function (o) {
                return o.kind === 'ched' || o.kind === 'corn' || o.kind === 'ecel';
            }) && rows[headerRows].some(function (o) { return o.kind !== 'ecel'; })) headerRows += 1;
        }
        const thead = headerRows ? el('thead') : null;
        const tbody = continuing ? table.tBodies[0] : el('tbody');

        rows.forEach(function (row, r) {
            const tr = el('tr');
            row.forEach(function (o, c) {
                if (o.r !== r || o.c !== c) return;   // a position another cell owns
                const isHeader = o.kind === 'ched' || o.kind === 'rhed' || o.kind === 'corn' || o.kind === 'srow';
                const td = el(isHeader ? 'th' : 'td', 'is-' + o.kind);
                if (o.kind === 'ched' || o.kind === 'corn') td.scope = o.cEnd > o.c ? 'colgroup' : 'col';
                if (o.kind === 'rhed') td.scope = o.rEnd > o.r ? 'rowgroup' : 'row';
                if (o.cEnd > o.c) td.colSpan = o.cEnd - o.c + 1;
                if (o.rEnd > o.r) td.rowSpan = o.rEnd - o.r + 1;
                dclgNodes(o.nodes, td, ctx, false);
                tr.appendChild(td);
            });
            (r < headerRows ? thead : tbody).appendChild(tr);
        });
        if (thead) table.appendChild(thead);
        if (!continuing) table.appendChild(tbody);
        return table;
    }

    function dclgText(node) {
        return (node.textContent || '').replace(/\s+/g, ' ').trim();
    }

    function addDclgFurnitureToggle(toolbar, content) {
        const label = el('label');
        const box = el('input');
        box.type = 'checkbox';
        box.addEventListener('change', function () {
            content.classList.toggle('show-furniture', box.checked);
        });
        label.appendChild(box);
        label.appendChild(document.createTextNode(' Page furniture'));
        const toggle = toolbar.querySelector('.theme-toggle');
        toolbar.insertBefore(el('span', 'separator'), toggle);
        toolbar.insertBefore(label, toggle);
    }


    // ==========================================================
    // Utilities
    // ==========================================================

    function showMessage(html) {
        document.getElementById('content').innerHTML = '<p class="state-message">' + html + '</p>';
    }

    function escHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    function escAttr(s) { return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }

    function el(tag, cls) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        return e;
    }

})();
</script>

</body>
</html>
