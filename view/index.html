<!--
    Axe Viewer
    Author: David M. Anderson
    Built with AI assistance (Claude, Anthropic)
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Defense-in-depth. The viewer uses inline scripts, so script-src keeps
         'unsafe-inline'; the value here is locking base-uri and object-src and
         confining connect-src to same-origin (external feeds, when allowlisted,
         must also be added to connect-src). A stronger header-based CSP with a
         nonce and frame-ancestors is recommended at deploy time — see SECURITY.md. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
    <title>View</title>
    <link rel="stylesheet" href="../default.css">
    <link rel="stylesheet" href="../../brand.css"><!-- site brand (sibling of axe/); overrides default, 404s harmlessly when absent -->
    <link rel="stylesheet" href="../axe.css">
    <link rel="stylesheet" href="../calendar.css">
    <script src="../dependencies/marked.min.js"></script>
    <script src="../dependencies/purify.min.js"></script>
    <script src="../calendar.js"></script>
    <script src="../toml.js"></script>
    <script src="../theme.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 1.5rem;
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            font-size: 0.85rem;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: var(--z-sticky);
        }

        .toolbar .title {
            font-weight: 600;
            color: var(--color-text);
            margin-right: auto;
        }

        .toolbar .title a {
            color: var(--color-accent);
            text-decoration: none;
        }

        .toolbar .title a:hover { text-decoration: underline; }

        .toolbar .title .sep {
            color: var(--color-text-muted);
            opacity: 0.5;
            margin: 0 0.25rem;
        }

        .toolbar select, .toolbar button, .toolbar input {
            font-size: 0.8rem;
            padding: 0.3rem 0.5rem;
            width: auto;
        }

        .toolbar label {
            display: inline;
            font-weight: normal;
            font-size: 0.8rem;
            margin: 0;
            color: var(--color-text-muted);
        }

        .toolbar .info {
            color: var(--color-text-muted);
            font-size: 0.8rem;
        }

        .toolbar .separator {
            width: 1px;
            height: 1.25rem;
            background: var(--color-border);
        }

        /* .theme-toggle styling comes from axe.css (framework). */

        /* Content area - override axe constraints.
           width:100% is required, not just max-width: in the flex-column body,
           main's inherited `margin: 0 auto` otherwise shrinks it to content
           width and centers it (auto cross-axis margins disable the stretch). */
        body > main {
            flex: 1;
            padding: 0;
            max-width: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* --- CSV view --- */
        .csv-wrap {
            flex: 1;
            overflow: auto;
            /* GNOME/GTK overlay scrollbars auto-hide, so a wide table gives no
               cue that it scrolls. Opt into an always-visible on-brand bar here
               — setting scrollbar-color is what takes Firefox out of overlay
               mode. Firefox's scrollbar-width takes no pixel value, so `auto`
               is the wide track; the ::-webkit- rules set an explicit ~1.75x
               width for Chromium and Safari. */
            scrollbar-width: auto;
            scrollbar-color: var(--color-text-muted) color-mix(in srgb, var(--color-text-muted) 18%, transparent);
        }

        .csv-wrap::-webkit-scrollbar { width: 21px; height: 21px; }
        .csv-wrap::-webkit-scrollbar-thumb {
            background: var(--color-text-muted);
            border-radius: 10px;
        }
        .csv-wrap::-webkit-scrollbar-track {
            background: color-mix(in srgb, var(--color-text-muted) 18%, transparent);
        }

        /* Auto layout sizes each column to its content (capped per cell below)
           rather than cramming every column into the viewport; min-width:100%
           still fills the width when a narrow file leaves slack, and the table
           overflows .csv-wrap into a horizontal scrollbar when it's wide. */
        .csv-table {
            font-size: 0.85rem;
            /* separate (not collapse) is required for the sticky header to work
               in Firefox — it drops stickiness on a th under border-collapse.
               border-spacing:0 keeps cells flush; the single-side borders below
               (row bottoms, the row-num right edge) don't double up. */
            border-collapse: separate;
            border-spacing: 0;
            table-layout: auto;
            min-width: 100%;
        }

        .csv-table th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--color-surface);
            border-bottom: 2px solid var(--color-border);
            padding: 0.5rem 0.75rem;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        .csv-table th:hover { color: var(--color-accent); }

        .csv-table th .sort-arrow {
            font-size: 0.65em;
            margin-left: 0.3rem;
            opacity: 0.4;
        }

        .csv-table th .sort-arrow.active {
            opacity: 1;
            color: var(--color-accent);
        }

        .csv-table td {
            padding: 0.35rem 0.75rem;
            border-bottom: 1px solid var(--color-border);
            white-space: nowrap;
            min-width: 5rem;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .csv-table tbody tr:hover {
            background: color-mix(in srgb, var(--color-accent) 8%, transparent);
        }

        /* The header and filter rows are both sticky; without distinct offsets
           they'd both pin to top:0 and the filter row (later in the DOM) would
           cover the header. Sit the filter row just below the header — its
           height is measured per render into --head-h (it varies with the
           font/zoom), with a sane fallback. */
        .csv-table .filter-row th {
            padding: 0.25rem 0.5rem;
            border-bottom: 2px solid var(--color-border);
            top: var(--head-h, 2.4rem);
        }

        .csv-table .filter-row input {
            font-size: 0.78rem;
            padding: 0.2rem 0.4rem;
            width: 100%;
            min-width: 60px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            color: var(--color-text);
            border-radius: calc(var(--radius) * 0.6);
        }

        .csv-table .filter-row input:focus {
            border-color: var(--color-accent);
            outline: none;
        }

        .group-header td {
            background: var(--color-surface);
            font-weight: 600;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid var(--color-border);
        }

        .group-header td:hover { color: var(--color-accent); }

        .group-header .toggle {
            font-size: 0.65em;
            margin-right: 0.5rem;
            display: inline-block;
            transition: transform 0.15s;
        }

        .group-header.collapsed .toggle { transform: rotate(-90deg); }

        .group-hidden { display: none; }

        /* Freeze the row-number column during horizontal scroll, mirroring the
           sticky header's vertical freeze. Stacking: body cells (auto) < this
           frozen column (6) < the sticky header row (10) < the header's own
           number cells, which are the top-left corner and freeze on both axes
           (12, set under thead below). The opaque background keeps the columns
           it scrolls past from showing through. */
        .csv-table .row-num {
            position: sticky;
            left: 0;
            z-index: 6;
            background: var(--color-bg);
            color: var(--color-text-muted);
            text-align: right;
            font-size: 0.75rem;
            padding-right: 0.5rem;
            width: var(--row-num-width, 2.5rem);
            min-width: 0;
            white-space: nowrap;
            border-right: 1px solid var(--color-border);
        }

        /* The header's number cells (the "#" and the empty filter cell) are the
           top-left corner: frozen on both axes, so they ride above the sticky
           header row and the frozen column alike, and take the header surface. */
        .csv-table thead .row-num {
            z-index: 12;
            background: var(--color-surface);
        }

        /* Keep the row-hover band continuous across the frozen cell — its opaque
           background would otherwise punch a gap in the highlight. */
        .csv-table tbody tr:hover .row-num {
            background: color-mix(in srgb, var(--color-accent) 8%, var(--color-bg));
        }

        /* --- Markdown view --- */
        .md-view {
            /* width:100% for the same reason body>main needs it: as a flex item
               in the flex-column main, the auto cross-axis margins disable the
               stretch, so without an explicit width a short document shrinks to
               its content and floats centered instead of filling the column. */
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        /* --- TOML view ---
           A TOML document is a tree of tables, so the render is a tree of
           sections: scalars in a field grid, a table array as an actual
           table. Wider than .md-view because those tables carry columns,
           narrow enough that prose in them stays readable. Like every other
           component here it carries no color of its own — the contract
           variables do the work. */
        .toml-view {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        /* Key on the left, value on the right, both baselines aligned. The
           key column sizes to the longest key (capped) instead of a fixed
           width, so short-keyed documents don't render a canyon. */
        .toml-fields {
            display: grid;
            grid-template-columns: minmax(6rem, max-content) minmax(0, 1fr);
            gap: 0.45rem 1.75rem;
            margin: 0 0 1.75rem;
        }
        .toml-fields dt {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--color-text-muted);
            word-break: break-word;
        }
        .toml-fields dd {
            margin: 0;
            min-width: 0;
            overflow-wrap: anywhere;
        }
        /* An inline table nests one grid inside another; drop the outer
           bottom margin so it doesn't stack a gap inside a row. */
        .toml-fields .toml-fields {
            margin: 0;
            gap: 0.2rem 1rem;
        }

        .toml-section { margin: 0 0 2rem; }
        .toml-section > h2,
        .toml-section > h3,
        .toml-section > h4,
        .toml-section > h5,
        .toml-section > h6 {
            margin: 0 0 0.75rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid var(--color-border);
        }
        /* Nested sections indent so the tree is legible without drawing
           lines for it. */
        .toml-section .toml-section {
            margin-left: 1rem;
            padding-left: 1rem;
            border-left: 2px solid var(--color-border);
        }

        /* A table array is the one shape that reads better as a grid than
           as a list, so it gets a real table — and its own scroll container,
           since the page body must never scroll sideways. */
        .toml-table-wrap {
            overflow-x: auto;
            margin: 0 0 1.5rem;
        }
        .toml-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .toml-table th {
            text-align: left;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--color-text-muted);
            padding: 0.5rem 0.9rem 0.5rem 0;
            border-bottom: 2px solid var(--color-border);
            white-space: nowrap;
        }
        .toml-table td {
            padding: 0.55rem 0.9rem 0.55rem 0;
            border-bottom: 1px solid var(--color-border);
            vertical-align: top;
        }
        .toml-table tbody tr:hover { background: var(--color-surface); }

        /* Value types. Numbers and dates line up in a column, so they take
           the mono face and tabular figures; a multi-line string is prose
           and keeps its line breaks. */
        .toml-num,
        .toml-date {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }
        /* The literal the document was written with is on the title, so the
           formatted date is marked as having more behind it — faintly, since
           every date in the file carries it. */
        .toml-date {
            border-bottom: 1px dotted color-mix(in srgb, var(--color-text-muted) 45%, transparent);
            cursor: help;
        }
        .toml-prose {
            white-space: pre-wrap;
            margin: 0;
            font-family: var(--font-body);
            line-height: var(--line-height);
        }
        .toml-bool {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            padding: 0.05rem 0.45rem;
            border-radius: var(--radius);
            background: color-mix(in srgb, var(--color-text-muted) 15%, transparent);
        }
        .toml-bool.is-true {
            background: color-mix(in srgb, var(--color-success) 20%, transparent);
        }
        .toml-list {
            margin: 0;
            padding-left: 1.1rem;
        }
        .toml-empty { color: var(--color-text-muted); }

        /* --- DocLang view ---
           A DocLang file already says what each part of a document is —
           heading, paragraph, list, OTSL table, picture, code — so the
           render maps each element onto the HTML element with the same
           meaning and lets the base styles do the rest. It reads like the
           Markdown view, at the same width, because it is the same kind of
           thing: a document. */
        .dclg-view {
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        /* Page furniture — running headers and footers, and anything the
           document puts on its furniture or background layer — repeats on
           every page and reads as noise in a continuous flow, so it stays
           hidden until the toolbar toggle asks for it. */
        .dclg-furniture { display: none; }
        .dclg-view.show-furniture .dclg-furniture {
            display: block;
            font-size: 0.8rem;
            color: var(--color-text-muted);
        }

        /* A page break is a rule with the page number it opens. */
        .dclg-page-break {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 2rem 0;
            font-size: 0.75rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .dclg-page-break::before,
        .dclg-page-break::after {
            content: '';
            flex: 1;
            border-top: 1px solid var(--color-border);
        }

        /* Inline vocabulary. <content> is the one place the format
           preserves whitespace; everything else collapses like XML. */
        .dclg-content { white-space: pre-wrap; }
        .dclg-handwriting { font-family: cursive; }
        .dclg-checkbox { font-family: var(--font-mono); }
        span.dclg-heading { font-weight: 600; }
        .dclg-hint {
            font-size: 0.85em;
            font-style: italic;
            color: var(--color-text-muted);
        }
        .dclg-footnote { font-size: 0.85rem; }

        /* A caption leads a paragraph, list, or group and follows a
           picture, code block, or formula; a table gets a real <caption>. */
        .dclg-figure > figcaption:first-child {
            margin: 0 0 0.5rem;
            text-align: left;
        }

        /* Code keeps the base <pre> look; the language label rides its
           corner. Raw text inside collapses like XML, and only <content>
           keeps its whitespace, so the rule is one rule. */
        .dclg-code {
            position: relative;
            white-space: normal;
        }
        .dclg-code[data-label]::before {
            content: attr(data-label);
            position: absolute;
            top: 0.35rem;
            right: 0.6rem;
            font-size: 0.7rem;
            color: var(--color-text-muted);
        }

        /* A formula is LaTeX source, shown as source: no math engine is
           vendored, and a reader can still read it. */
        .dclg-formula {
            font-family: var(--font-mono);
            font-size: 0.9em;
        }
        div.dclg-formula {
            text-align: center;
            margin: 0 0 1rem;
        }

        /* Pictures. The image is the picture; the text the document
           found inside it, and any description, are the fallback shown
           only when there is no image to show. */
        .dclg-picture img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
        }
        span.dclg-picture img {
            display: inline;
            height: 1.25em;
            width: auto;
            vertical-align: middle;
            margin: 0;
        }
        .dclg-picture-text,
        .dclg-picture-placeholder { display: none; }
        .dclg-picture.no-image img { display: none; }
        .dclg-picture.no-image .dclg-picture-placeholder {
            display: block;
            padding: 1.5rem;
            border: 1px dashed var(--color-border);
            border-radius: var(--radius);
            text-align: center;
            color: var(--color-text-muted);
            font-size: 0.9rem;
        }
        .dclg-picture.no-image .dclg-picture-text {
            display: block;
            padding: 1rem 1.25rem;
            border: 1px dashed var(--color-border);
            border-radius: var(--radius);
            font-size: 0.9rem;
        }
        .dclg-picture .dclg-table-wrap { margin-top: 1rem; }

        /* Lists. A list whose items carry their own markers — the printed
           glyph or number, or a checkbox — shows those instead of the
           browser's, in a column of their own. */
        .dclg-list:not(.has-markers) > li > .dclg-marker { display: none; }
        .dclg-list.has-markers {
            list-style: none;
            padding-left: 0.25rem;
        }
        .dclg-list.has-markers > li {
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr);
            column-gap: 0.6em;
        }
        .dclg-item > p { margin-bottom: 0.25rem; }
        .dclg-item > :last-child { margin-bottom: 0; }

        /* Tables: the base styles, plus a scroll container of their own,
           since the page body must never scroll sideways. Row headers and
           section rows take the surface so the axes of a table read. */
        .dclg-table-wrap {
            overflow-x: auto;
            margin: 0 0 1.5rem;
        }
        .dclg-table { margin-bottom: 0; }
        .dclg-table th.is-rhed,
        .dclg-table th.is-corn,
        .dclg-table th.is-srow {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
        }
        .dclg-table td > p,
        .dclg-table th > p { margin-bottom: 0.25rem; }
        .dclg-table td > :last-child,
        .dclg-table th > :last-child { margin-bottom: 0; }

        /* Fields: a form read back. Each item is a key beside its values;
           a fillable value left blank is drawn as the blank it is. */
        .dclg-field_region { margin: 0 0 1.5rem; }
        .dclg-field_item {
            margin: 0 0 0.6rem;
            padding-left: 0.75rem;
            border-left: 2px solid var(--color-border);
        }
        .dclg-field_item p { margin-bottom: 0.2rem; }
        .dclg-key {
            font-weight: 600;
            margin-right: 0.5em;
        }
        .dclg-value.is-fillable {
            display: inline-block;
            min-width: 8em;
            border-bottom: 1px dotted var(--color-text-muted);
        }
        p.dclg-value.is-fillable { display: block; }

        /* --- Slides view: native one-at-a-time presenter ---
           The stage is the largest 16:9 box that fits the viewport, and its
           type scales with `cqw` (container-query width) units, so the deck
           resizes with pure CSS — no JS measurement and no resize handler. JS
           only drives which slide is active and the navigation. */
        .deck {
            position: fixed;
            inset: 0;
            background: var(--color-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .stage {
            position: relative;
            width: min(100vw, 177.78vh);  /* 16:9: clamp by width or height */
            aspect-ratio: 16 / 9;
            background: var(--color-surface);
            box-shadow: var(--shadow-md);
            container-type: size;
            overflow: hidden;
        }
        .slide {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            padding: 6cqh 7cqw;
            box-sizing: border-box;
            font-size: 2.7cqw;       /* everything below sizes in em off this */
            line-height: 1.4;
            color: var(--color-text);
            overflow: auto;
        }
        .slide.active { display: flex; }
        .slide > :first-child { margin-top: 0; }
        .slide > :last-child { margin-bottom: 0; }
        .slide h1 { font-size: 2.3em; margin: 0 0 0.4em; }
        .slide h2 { font-size: 1.7em; margin: 0 0 0.4em; color: var(--color-accent); }
        .slide h3 { font-size: 1.25em; margin: 0 0 0.4em; }
        .slide h1, .slide h2 {
            border-bottom: 0.12em solid var(--color-accent);
            padding-bottom: 0.15em;
            display: inline-block;
            align-self: flex-start;
        }
        .slide p { margin: 0.5em 0; }
        .slide ul, .slide ol { margin: 0.5em 0; padding-left: 1.4em; }
        .slide li { margin: 0.25em 0; }
        .slide code {
            font-family: var(--font-mono);
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 0.05em 0.3em;
            font-size: 0.85em;
        }
        .slide pre {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 0.8em 1em;
            overflow: auto;
            font-size: 0.7em;
        }
        .slide pre code { background: none; border: none; padding: 0; }
        .slide blockquote {
            margin: 0.6em 0;
            padding: 0.5em 0.9em;
            background: var(--color-bg);
            border-left: 0.2em solid var(--color-highlight);
            border-radius: var(--radius);
        }
        .slide table { border-collapse: collapse; font-size: 0.85em; }
        .slide th, .slide td {
            text-align: left;
            padding: 0.3em 0.7em;
            border-bottom: 1px solid var(--color-border);
        }
        .slide th { background: var(--color-nav-bg); color: var(--color-nav-text); }

        /* Deck chrome: progress bar, counter, nav buttons. Quiet until hover. */
        .deck-progress {
            position: absolute;
            left: 0; bottom: 0;
            height: 4px; width: 100%;
            background: var(--color-border);
        }
        .deck-progress-bar {
            display: block; height: 100%; width: 0;
            background: var(--color-accent);
            transition: width 0.2s ease;
        }
        .deck-controls {
            position: absolute;
            right: 1rem; bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            opacity: 0.25;
            transition: opacity 0.2s ease;
        }
        .deck:hover .deck-controls { opacity: 1; }
        .deck-controls button {
            font: inherit;
            font-size: 1.1rem;
            line-height: 1;
            color: var(--color-nav-text);
            background: var(--color-nav-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 0.2em 0.5em;
            cursor: pointer;
        }
        .deck-controls button:hover { background: var(--color-accent); color: #fff; }
        .deck-counter {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            min-width: 3.2em;
            text-align: center;
        }

        /* --- iCalendar view --- */
        /* Full-bleed + full-height: a calendar wants all the space it can get
           (Teams-style). This element is also the calendar's own container
           (.axe-cal, a flex column), so flex:1 + min-height:0 bound it inside
           the flex-column content area — that gives the calendar's toolbar +
           scrolling body a definite height to divide. */
        .ical-wrap {
            flex: 1;
            min-height: 0;
            width: 100%;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        /* States */
        .state-message {
            text-align: center;
            color: var(--color-text-muted);
            padding: 4rem 2rem;
            font-size: 1rem;
        }

        .state-message code { font-size: 0.9em; }

        @media (max-width: 600px) {
            .toolbar { padding: 0.5rem 0.75rem; }
            .col-date { display: none; }
            .md-view { padding: 1.5rem 1rem; }
            .toml-view { padding: 1.5rem 1rem; }
            .dclg-view { padding: 1.5rem 1rem; }
            /* Below the key column's minimum there is no room for two
               columns, so the field grid stacks key over value. */
            .toml-fields { grid-template-columns: minmax(0, 1fr); gap: 0.1rem 0; }
            .toml-fields dd { margin: 0 0 0.75rem; }
            .toml-section .toml-section { margin-left: 0.5rem; padding-left: 0.5rem; }
            .ical-wrap { padding: 1rem 0.75rem; }
        }
    </style>
</head>
<body>

<div class="toolbar" id="toolbar" style="display:none">
    <span class="title" id="title"></span>
    <span class="info" id="info"></span>
    <button class="theme-toggle" aria-label="Toggle theme"></button>
</div>

<main>
    <div id="content"><p class="state-message">Loading...</p></div>
</main>

<script>
(function() {

    // Theme detection + toggle binding live in ../theme.js (loaded in <head>,
    // inlined into baked files by cleave's SRC_THEME). Don't re-roll it here.

    // --- External-host allowlist (security) ---
    // The viewer renders fetched content as live HTML in this origin, so an
    // unrestricted ?url=https://… is a reflected-XSS vector: a crafted link
    // would run a third party's markup as us. External fetch is therefore
    // DENIED by default. To enable specific remote feeds, add their hostnames
    // here (exact host match, e.g. 'calendar.example.com'). Leave empty to
    // keep external fetch off entirely. Same-origin (relative) paths are
    // always allowed and are unaffected by this list.
    const EXTERNAL_ALLOWLIST = [];

    function isAllowedExternal(rawUrl) {
        let host;
        try { host = new URL(rawUrl).hostname; } catch (e) { return false; }
        return EXTERNAL_ALLOWLIST.includes(host);
    }

    // --- Source: embedded (baked) or fetched ---
    const params = new URLSearchParams(location.search);
    const embedEl = document.getElementById('axe-embed');
    // How to render a Markdown file: the parameter is the primary switch, the
    // analog of `pandoc -t pptx` vs `-t docx` — the target decides, not the
    // file. A baked file carries it as data-view; frontmatter is the fallback.
    const viewParam = ((embedEl && embedEl.getAttribute('data-view')) || params.get('view') || '').toLowerCase();

    // Shared by both source paths and read by the renderers, so they're
    // declared with `let`: the baked branch sets `name` and leaves `fetchUrl`
    // empty (renderIcal passes it as the calendar's sourceUrl — empty means a
    // local/inline feed with no Subscribe link, which is exactly right here).
    let name = '';
    let fetchUrl = '';

    // Constants the TOML renderer reads. They live up here, above the
    // dispatch, rather than beside the renderer that uses them: the baked
    // branch below calls a renderer synchronously, part-way down this
    // script, so anything declared after it is still in the temporal dead
    // zone when it runs. The fetch path never noticed — its .then() defers
    // past the whole script — which is exactly why the baked path is the
    // one to check when adding a renderer.
    const TOML_LINK_SCHEME = /^(?:https?:\/\/|mailto:)/i;
    const TOML_ANY_SCHEME = /^[A-Za-z][A-Za-z0-9+.-]*:/;
    const TOML_EMAIL = /^[^\s@<>()[\],;:"]+@[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)+$/;
    const TOML_DOC_EXT = /\.(?:pdf|md|markdown|csv|tsv|ics|ical|txt|html?|docx?|xlsx?|pptx?|odt|ods|rtf|png|jpe?g|gif|webp|svg|tiff?|zip|json|toml|ya?ml|xml)$/i;
    const TOML_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
                         'July', 'August', 'September', 'October', 'November', 'December'];

    // The DocLang renderer's constants, up here for the same reason.
    // Property elements form an element's head and are consumed by the
    // host; the formatting map is DocLang's inline vocabulary onto HTML's.
    const DCLG_PROPERTIES = new Set(['label', 'thread', 'xref', 'href', 'layer', 'location',
                                     'caption', 'description', 'summary', 'custom']);
    const DCLG_FORMATTING = { bold: 'strong', italic: 'em', underline: 'u', strikethrough: 's',
                              superscript: 'sup', subscript: 'sub' };
    const DCLG_CELLS = new Set(['fcel', 'ecel', 'ched', 'rhed', 'corn', 'srow']);
    const DCLG_LINK_SCHEME = /^(?:https?:\/\/|mailto:)/i;
    const DCLG_IMAGE_SCHEME = /^(?:https?:\/\/|data:image\/)/i;
    const DCLG_ANY_SCHEME = /^[A-Za-z][A-Za-z0-9+.-]*:/;

    const renderers = {
        csv: renderCsv,
        tsv: renderCsv,
        md: renderMarkdownEntry,
        markdown: renderMarkdownEntry,
        ics: renderIcal,
        ical: renderIcal,
        toml: renderToml,
        dclg: renderDoclang
    };

    // Baked, server-free mode: `cleave` inlines the document into a hidden
    // <textarea id="axe-embed"> so the viewer renders over file:// with no
    // fetch (browsers block fetch() of local files). A textarea is RCDATA, so
    // the baked content is safe to read verbatim from .value. When the block
    // is present, render it and stop — the URL/fetch path below is never hit.
    if (embedEl) {
        const bakedExt = (embedEl.getAttribute('data-ext') || '').toLowerCase();
        name = embedEl.getAttribute('data-name') || ('document.' + bakedExt);
        document.title = name;
        if (renderers[bakedExt]) {
            renderers[bakedExt](embedEl.value, bakedExt);
        } else {
            showMessage('Embedded document type <code>' + escHtml(bakedExt) + '</code> is not supported.');
        }
        return;
    }

    // --- URL parameter ---
    const urlParam = params.get('url');

    if (!urlParam) {
        showMessage('No path specified. Use <code>?url=path/to/file</code>');
        return;
    }

    // External URL (http/https) or root-relative path
    const isExternal = /^https?:\/\//i.test(urlParam);

    if (isExternal && !isAllowedExternal(urlParam)) {
        showMessage('External URLs are not permitted by this viewer.');
        return;
    }
    fetchUrl = isExternal ? urlParam : '/' + urlParam.replace(/^\//, '').replace(/\/$/, '');
    const cleanPath = isExternal ? urlParam.replace(/^https?:\/\/[^/]+\/?/, '') : urlParam.replace(/^\//, '').replace(/\/$/, '');
    name = cleanPath.split('/').pop() || cleanPath;

    // --- Determine type by extension ---
    const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : '';

    if (renderers[ext]) {
        // It's a file we can render
        document.title = name + ' - View';
        fetch(fetchUrl)
            .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
            .then(text => renderers[ext](text, ext))
            .catch(() => showMessage('Could not load <code>' + escHtml(fetchUrl) + '</code>'));
    } else if (!ext && isExternal) {
        // No extension but external: try as CSV (common for API endpoints)
        document.title = name + ' - View';
        fetch(fetchUrl)
            .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
            .then(text => renderCsv(text, 'csv'))
            .catch(() => showMessage('Could not load <code>' + escHtml(fetchUrl) + '</code>'));
    } else if (ext) {
        // Unknown extension: let the browser handle it directly
        location.replace(fetchUrl);
    } else {
        // No extension, local: nothing to render. Directory browsing lives in
        // the separate `browse` tool now, not the viewer.
        showMessage('The viewer renders a single document. Point it at a <code>.csv</code>, <code>.md</code>, <code>.ics</code>, <code>.toml</code>, or <code>.dclg</code> file.');
    }


    // ==========================================================
    // CSV Renderer
    // ==========================================================

    function renderCsv(text, ext) {
        const delim = ext === 'tsv' ? '\t' : ',';
        const rows = parseCsv(text, delim);
        if (rows.length < 2) {
            showMessage('File is empty or has no data rows.');
            return;
        }

        const headers = rows[0];
        const data = rows.slice(1);

        let sortCol = -1;
        let sortDir = 0;
        let groupCol = -1;
        let filters = new Array(headers.length).fill('');
        let collapsedGroups = new Set();

        // Toolbar
        const toolbar = document.getElementById('toolbar');
        toolbar.style.display = 'flex';
        document.getElementById('title').textContent = name;

        const sep1 = el('span', 'separator');
        const groupLabel = el('label');
        groupLabel.textContent = 'Group by:';
        const groupSelect = el('select');
        groupSelect.innerHTML = '<option value="-1">None</option>' +
            headers.map((h, i) => '<option value="' + i + '">' + escHtml(h) + '</option>').join('');
        groupSelect.addEventListener('change', () => {
            groupCol = parseInt(groupSelect.value);
            collapsedGroups.clear();
            render();
        });

        const sep2 = el('span', 'separator');
        const copyBtn = el('button');
        copyBtn.textContent = 'Copy filtered';
        copyBtn.addEventListener('click', copyFiltered);

        const sep3 = el('span', 'separator');
        const rowCount = el('span', 'info');

        // Insert before the theme toggle
        const toggle = toolbar.querySelector('.theme-toggle');
        toolbar.insertBefore(sep1, toggle);
        toolbar.insertBefore(groupLabel, toggle);
        toolbar.insertBefore(groupSelect, toggle);
        toolbar.insertBefore(sep2, toggle);
        toolbar.insertBefore(copyBtn, toggle);
        toolbar.insertBefore(sep3, toggle);
        toolbar.insertBefore(rowCount, toggle);

        const content = document.getElementById('content');
        content.innerHTML = '';
        content.className = 'csv-wrap';
        // Bound the flex chain (body -> main -> .csv-wrap) to the viewport so
        // .csv-wrap is the scroll container on BOTH axes. The default body is
        // min-height:100vh and grows with content, which makes the page scroll
        // instead: the sticky header then has no inner scroller to stick within,
        // and the horizontal scrollbar ends up at the foot of a too-tall wrap,
        // below the fold. Pinning the height fixes both (same move as the
        // calendar's list view).
        document.body.style.height = '100vh';

        const table = document.createElement('table');
        table.className = 'csv-table';
        content.appendChild(table);

        render();

        function getFilteredData() {
            return data.filter(row => filters.every((f, i) => {
                if (!f) return true;
                return (row[i] || '').toLowerCase().includes(f.toLowerCase());
            }));
        }

        function render() {
            const filtered = getFilteredData();
            const digits = String(Math.max(filtered.length, 1)).length;
            table.style.setProperty('--row-num-width', 'calc(' + digits + 'ch + 1.25rem)');

            let sorted = filtered;
            if (sortCol >= 0 && sortDir > 0) {
                sorted = [...filtered].sort((a, b) => {
                    let va = a[sortCol] || '', vb = b[sortCol] || '';
                    const na = parseFloat(va.replace(/[,$%]/g, ''));
                    const nb = parseFloat(vb.replace(/[,$%]/g, ''));
                    if (!isNaN(na) && !isNaN(nb)) return sortDir === 1 ? na - nb : nb - na;
                    va = va.toLowerCase(); vb = vb.toLowerCase();
                    if (va < vb) return sortDir === 1 ? -1 : 1;
                    if (va > vb) return sortDir === 1 ? 1 : -1;
                    return 0;
                });
            }

            let html = '<thead><tr><th class="row-num">#</th>';
            headers.forEach((h, i) => {
                const arrow = sortCol === i
                    ? (sortDir === 1 ? '<span class="sort-arrow active">\u25b2</span>'
                        : sortDir === 2 ? '<span class="sort-arrow active">\u25bc</span>'
                        : '<span class="sort-arrow">\u25b2</span>')
                    : '<span class="sort-arrow">\u25b2</span>';
                html += '<th data-col="' + i + '">' + escHtml(h) + arrow + '</th>';
            });
            html += '</tr><tr class="filter-row"><th class="row-num"></th>';
            headers.forEach((h, i) => {
                html += '<th><input type="text" placeholder="Filter..." data-filter="' + i + '" value="' + escAttr(filters[i]) + '"></th>';
            });
            html += '</tr></thead><tbody>';

            let visibleCount = 0;
            if (groupCol >= 0) {
                const groups = new Map();
                sorted.forEach(row => {
                    const key = row[groupCol] || '(empty)';
                    if (!groups.has(key)) groups.set(key, []);
                    groups.get(key).push(row);
                });

                groups.forEach((rows, key) => {
                    const collapsed = collapsedGroups.has(key);
                    html += '<tr class="group-header' + (collapsed ? ' collapsed' : '') + '" data-group="' + escAttr(key) + '">';
                    html += '<td colspan="' + (headers.length + 1) + '"><span class="toggle">\u25bc</span>' + escHtml(key) + ' (' + rows.length + ')</td></tr>';
                    rows.forEach(row => {
                        visibleCount++;
                        html += '<tr class="' + (collapsed ? 'group-hidden' : '') + '" data-group-row="' + escAttr(key) + '">';
                        html += '<td class="row-num">' + visibleCount + '</td>';
                        row.forEach(cell => html += '<td title="' + escAttr(cell) + '">' + escHtml(cell) + '</td>');
                        html += '</tr>';
                    });
                });
            } else {
                sorted.forEach(row => {
                    visibleCount++;
                    html += '<tr><td class="row-num">' + visibleCount + '</td>';
                    row.forEach(cell => html += '<td title="' + escAttr(cell) + '">' + escHtml(cell) + '</td>');
                    html += '</tr>';
                });
            }

            html += '</tbody>';
            table.innerHTML = html;
            rowCount.textContent = visibleCount + ' of ' + data.length + ' rows';

            // Pin the sticky filter row directly below the sticky header row by
            // measuring the header's rendered height (varies with font/zoom).
            const headRow = table.querySelector('thead tr');
            if (headRow) table.style.setProperty('--head-h', headRow.offsetHeight + 'px');

            table.querySelectorAll('th[data-col]').forEach(th => {
                th.addEventListener('click', () => {
                    const col = parseInt(th.dataset.col);
                    if (sortCol === col) { sortDir = (sortDir + 1) % 3; if (sortDir === 0) sortCol = -1; }
                    else { sortCol = col; sortDir = 1; }
                    render();
                });
            });

            table.querySelectorAll('input[data-filter]').forEach(inp => {
                inp.addEventListener('input', () => {
                    filters[parseInt(inp.dataset.filter)] = inp.value;
                    render();
                    const newInp = table.querySelector('input[data-filter="' + inp.dataset.filter + '"]');
                    if (newInp) { newInp.focus(); newInp.selectionStart = newInp.selectionEnd = newInp.value.length; }
                });
            });

            table.querySelectorAll('.group-header').forEach(tr => {
                tr.addEventListener('click', () => {
                    const key = tr.dataset.group;
                    collapsedGroups.has(key) ? collapsedGroups.delete(key) : collapsedGroups.add(key);
                    render();
                });
            });
        }

        function copyFiltered() {
            const filtered = getFilteredData();
            let sorted = filtered;
            if (sortCol >= 0 && sortDir > 0) {
                sorted = [...filtered].sort((a, b) => {
                    let va = a[sortCol] || '', vb = b[sortCol] || '';
                    const na = parseFloat(va.replace(/[,$%]/g, ''));
                    const nb = parseFloat(vb.replace(/[,$%]/g, ''));
                    if (!isNaN(na) && !isNaN(nb)) return sortDir === 1 ? na - nb : nb - na;
                    va = va.toLowerCase(); vb = vb.toLowerCase();
                    if (va < vb) return sortDir === 1 ? -1 : 1;
                    if (va > vb) return sortDir === 1 ? 1 : -1;
                    return 0;
                });
            }
            const lines = [headers.join(',')];
            sorted.forEach(row => {
                lines.push(row.map(cell => {
                    if (cell.includes(',') || cell.includes('"') || cell.includes('\n'))
                        return '"' + cell.replace(/"/g, '""') + '"';
                    return cell;
                }).join(','));
            });
            navigator.clipboard.writeText(lines.join('\n')).then(() => {
                copyBtn.textContent = 'Copied!';
                setTimeout(() => copyBtn.textContent = 'Copy filtered', 1500);
            });
        }
    }


    // ==========================================================
    // CSV Parser
    // ==========================================================

    function parseCsv(text, delim) {
        const rows = [];
        let row = [], cell = '', inQuotes = false, i = 0;

        while (i < text.length) {
            const ch = text[i];
            if (inQuotes) {
                if (ch === '"') {
                    if (text[i + 1] === '"') { cell += '"'; i += 2; }
                    else { inQuotes = false; i++; }
                } else { cell += ch; i++; }
            } else {
                if (ch === '"') { inQuotes = true; i++; }
                else if (ch === delim) { row.push(cell); cell = ''; i++; }
                else if (ch === '\r') { row.push(cell); cell = ''; rows.push(row); row = []; i++; if (text[i] === '\n') i++; }
                else if (ch === '\n') { row.push(cell); cell = ''; rows.push(row); row = []; i++; }
                else { cell += ch; i++; }
            }
        }
        if (cell || row.length > 0) { row.push(cell); rows.push(row); }

        const maxCols = Math.max(...rows.map(r => r.length));
        rows.forEach(r => { while (r.length < maxCols) r.push(''); });
        return rows;
    }


    // ==========================================================
    // Markdown Renderer
    // ==========================================================

    // Entry point for .md / .markdown. Splits frontmatter, decides whether to
    // render the file as a document or a slide deck, and dispatches. Both are
    // the same .md file; only the rendering differs (pandoc's model).
    function renderMarkdownEntry(text) {
        const { meta, body } = parseFrontmatter(text);
        const mode = resolveMode(meta);
        if (mode === 'slides') {
            renderSlides(body, meta);
        } else {
            renderMarkdownDoc(body);
        }
    }

    // A leading YAML metadata block, pandoc/Jekyll style: `---` on the first
    // line, terminated by `---` or `...`. We don't pull in a YAML parser —
    // just scalar `key: value` lines, which is all the routing and titling
    // need. Returns the stripped body so the frontmatter never renders as a
    // stray rule or table.
    function parseFrontmatter(text) {
        const m = /^---\r?\n([\s\S]*?)\r?\n(?:---|\.\.\.)[ \t]*\r?\n?/.exec(text);
        if (!m) return { meta: {}, body: text };
        const meta = {};
        m[1].split(/\r?\n/).forEach(function (line) {
            const kv = /^([A-Za-z0-9_-]+)[ \t]*:[ \t]*(.*)$/.exec(line);
            if (kv) meta[kv[1].toLowerCase()] = kv[2].trim().replace(/^["']|["']$/g, '');
        });
        return { meta: meta, body: text.slice(m[0].length) };
    }

    // The parameter wins (explicit override: ?view=slides / ?view=doc), then
    // frontmatter (`mode: slides` | `presentation` | `deck`), else document.
    function resolveMode(meta) {
        if (viewParam === 'slides' || viewParam === 'deck' || viewParam === 'presentation') return 'slides';
        if (viewParam === 'doc' || viewParam === 'document') return 'document';
        const m = (meta.mode || '').toLowerCase();
        if (m === 'slides' || m === 'presentation' || m === 'deck') return 'slides';
        return 'document';
    }

    function renderMarkdownDoc(body) {
        document.getElementById('toolbar').style.display = 'flex';
        document.getElementById('title').textContent = name;

        const content = document.getElementById('content');
        content.className = 'md-view';
        // marked does not sanitize; the document is untrusted, so scrub the
        // rendered HTML through DOMPurify before it touches the DOM. Without
        // this, a .md file's raw <img onerror=...> / <script> runs as our origin.
        content.innerHTML = DOMPurify.sanitize(marked.parse(body));
    }

    // Pandoc's slide division, so the same .md a deck renders from is the file
    // `pandoc -t pptx` exports: a horizontal rule (`---` on its own line,
    // blank-line surrounded) always forces a new slide, and a heading at the
    // slide level starts one too. Slide level defaults the way pandoc computes
    // it (the highest heading level followed immediately by content) and can be
    // pinned with a `slide-level:` frontmatter key. The presenter that renders
    // the resulting slides is native (no third-party engine).
    function renderSlides(body, meta) {
        const tokens = marked.lexer(body);
        const slideLevel = meta['slide-level']
            ? parseInt(meta['slide-level'], 10)
            : computeSlideLevel(tokens);

        const chunks = [];
        let current = '';
        tokens.forEach(function (tok) {
            if (tok.type === 'hr') {
                chunks.push(current);
                current = '';
                return; // the rule is the break; it isn't rendered
            }
            if (tok.type === 'heading' && tok.depth <= slideLevel && current.trim() !== '') {
                chunks.push(current);
                current = '';
            }
            current += tok.raw;
        });
        if (current.trim() !== '') chunks.push(current);

        const slides = chunks.filter(function (c) { return c.trim() !== ''; });

        // Full-bleed presenter: the toolbar gives way to the deck.
        document.getElementById('toolbar').style.display = 'none';
        document.title = (meta.title || name);

        const content = document.getElementById('content');
        content.className = '';
        let html = '<div class="deck"><div class="stage">';
        slides.forEach(function (chunk) {
            html += '<section class="slide">' + DOMPurify.sanitize(marked.parse(chunk)) + '</section>';
        });
        html += '</div>' +
            '<div class="deck-progress"><span class="deck-progress-bar"></span></div>' +
            '<div class="deck-controls">' +
                '<button class="deck-prev" title="Previous (←)">‹</button>' +
                '<span class="deck-counter"></span>' +
                '<button class="deck-next" title="Next (→)">›</button>' +
                '<button class="deck-full" title="Full screen (f)">⛶</button>' +
            '</div></div>';
        content.innerHTML = html;

        // --- Navigation ---
        const deck = content.querySelector('.deck');
        const slideEls = Array.prototype.slice.call(content.querySelectorAll('.slide'));
        const bar = content.querySelector('.deck-progress-bar');
        const counter = content.querySelector('.deck-counter');
        const last = slideEls.length - 1;
        let idx = -1;

        function clamp(n) { return n < 0 ? 0 : (n > last ? last : n); }

        function show(n) {
            n = clamp(n);
            if (n === idx) return;
            idx = n;
            slideEls.forEach(function (el, i) { el.classList.toggle('active', i === idx); });
            counter.textContent = (idx + 1) + ' / ' + slideEls.length;
            bar.style.width = ((idx) / (last || 1) * 100) + '%';
            const hash = '#' + (idx + 1);
            if (location.hash !== hash) location.replace(hash);
        }

        function next() { show(idx + 1); }
        function prev() { show(idx - 1); }

        // Start from the hash (deep links + reload land on the same slide).
        const fromHash = parseInt((location.hash || '').replace('#', ''), 10);
        show(isNaN(fromHash) ? 0 : fromHash - 1);

        document.addEventListener('keydown', function (e) {
            if (e.defaultPrevented) return;
            switch (e.key) {
                case 'ArrowRight': case 'PageDown': case ' ': next(); break;
                case 'ArrowLeft': case 'PageUp': prev(); break;
                case 'Home': show(0); break;
                case 'End': show(last); break;
                case 'f': case 'F':
                    if (!document.fullscreenElement) { if (deck.requestFullscreen) deck.requestFullscreen(); }
                    else if (document.exitFullscreen) document.exitFullscreen();
                    break;
                default: return;
            }
            e.preventDefault();
        });

        content.querySelector('.deck-next').addEventListener('click', next);
        content.querySelector('.deck-prev').addEventListener('click', prev);
        content.querySelector('.deck-full').addEventListener('click', function () {
            if (!document.fullscreenElement) { if (deck.requestFullscreen) deck.requestFullscreen(); }
            else if (document.exitFullscreen) document.exitFullscreen();
        });

        // Back/forward through slide hashes.
        window.addEventListener('hashchange', function () {
            const h = parseInt((location.hash || '').replace('#', ''), 10);
            if (!isNaN(h)) show(h - 1);
        });

        // Touch swipe.
        let touchX = null;
        deck.addEventListener('touchstart', function (e) { touchX = e.changedTouches[0].clientX; }, { passive: true });
        deck.addEventListener('touchend', function (e) {
            if (touchX === null) return;
            const dx = e.changedTouches[0].clientX - touchX;
            if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); }
            touchX = null;
        }, { passive: true });

        // Click the slide to advance (PowerPoint/Keynote default). Skip clicks
        // on links so in-deck navigation still works, and skip click-drags that
        // selected text so copying a quote doesn't jump a slide. Back-nav stays
        // on the keys/button so right-click keeps the browser context menu.
        const stage = content.querySelector('.stage');
        stage.addEventListener('click', function (e) {
            if (e.target.closest('a')) return;
            if (window.getSelection().toString()) return;
            next();
        });
    }

    function computeSlideLevel(tokens) {
        let level = null;
        for (let i = 0; i < tokens.length; i++) {
            if (tokens[i].type !== 'heading') continue;
            let j = i + 1;
            while (j < tokens.length && tokens[j].type === 'space') j++;
            const next = tokens[j];
            if (next && next.type !== 'heading') {
                if (level === null || tokens[i].depth < level) level = tokens[i].depth;
            }
        }
        return level || 1;
    }


    // ==========================================================
    // iCalendar Renderer
    // ==========================================================

    function renderIcal(text) {
        const toolbar = document.getElementById('toolbar');
        toolbar.style.display = 'flex';
        document.getElementById('title').textContent = name;

        // The calendar's list view scrolls inside its own body, which needs a
        // definite height to divide. The page's default body is min-height:100vh
        // (grows to fit content — fine for a scrolling document, but it never
        // bounds the calendar). Pin the body to the viewport for this view so the
        // flex chain (body → main → content → .ical-wrap → .cal-body) is bounded.
        document.body.style.height = '100vh';

        const content = document.getElementById('content');
        content.className = '';
        content.innerHTML = '';
        // Flex column so the calendar (.ical-wrap, flex:1) fills main's height.
        content.style.flex = '1';
        content.style.minHeight = '0';
        content.style.display = 'flex';
        content.style.flexDirection = 'column';
        const wrap = el('div', 'ical-wrap');
        content.appendChild(wrap);

        // Initial view: ?view= (or a baked data-view) picks day/week/month/list,
        // the calendar analog of the Markdown doc/slides switch — the same param,
        // its valid values keyed to the file type. Validate against the calendar's
        // own registry so this can't drift if a view is added; anything else
        // (including the Markdown values) falls back to month.
        const initialView = (Calendar.views && Calendar.views[viewParam]) ? viewParam : 'month';

        // The calendar owns its own toolbar now (view tabs, Today, navigation,
        // date picker). The viewer chrome above keeps the filename/calname title,
        // event count, and theme toggle — so the component's toggle is opted out.
        // sourceUrl tells the calendar where this feed lives (we fetched the text
        // ourselves) so it can offer a Subscribe link. Zone + Export + Subscribe
        // drop into the component's actions slot once its shell exists.
        const cal = new Calendar(wrap, {
            source: text, sourceUrl: fetchUrl, view: initialView, themeToggle: false
        });

        return cal.render().then(() => {
            const slot = cal.getToolbarSlot();
            const nodes = [];

            // Display timezone. Empty value = the browser's local zone.
            const tzLabel = el('label'); tzLabel.textContent = 'Zone:';
            const tzSelect = el('select');
            const localZone = (Intl.DateTimeFormat().resolvedOptions().timeZone) || 'local';
            const zones = ['UTC', 'America/New_York', 'America/Chicago', 'America/Denver',
                'America/Los_Angeles', 'America/Anchorage', 'Pacific/Honolulu',
                'Europe/London', 'Europe/Berlin', 'Asia/Tokyo', 'Australia/Sydney'];
            let tzOpts = '<option value="">Local (' + escHtml(localZone) + ')</option>';
            for (const z of zones) tzOpts += '<option value="' + escAttr(z) + '">' + escHtml(z) + '</option>';
            tzSelect.innerHTML = tzOpts;
            tzSelect.addEventListener('change', () => cal.setTimezone(tzSelect.value || null));
            nodes.push(tzLabel, tzSelect);

            // Exports (download the current event set).
            const csvBtn = el('button', 'cal-action ghost'); csvBtn.textContent = 'Export CSV';
            csvBtn.addEventListener('click', () => cal.export('csv'));
            const icalBtn = el('button', 'cal-action ghost'); icalBtn.textContent = 'Export iCal';
            icalBtn.addEventListener('click', () => cal.export('ical'));
            nodes.push(csvBtn, icalBtn);

            // Subscribe — only when the feed lives at a real http(s) URL (not a
            // local file:// or inline source), so there's a stable URL to subscribe to.
            const sub = cal.getSubscribeUrl();
            if (sub) {
                const subLink = el('button', 'cal-action ghost');
                subLink.textContent = 'Subscribe';
                subLink.title = 'Subscribe in your calendar app — ' + sub.url;
                subLink.addEventListener('click', () => { window.location.href = sub.webcal; });
                const copyBtn = el('button', 'cal-action ghost');
                copyBtn.textContent = 'Copy URL';
                copyBtn.title = 'Copy the feed URL (for Google Calendar)';
                copyBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(sub.url).then(() => {
                        copyBtn.textContent = 'Copied!';
                        setTimeout(() => copyBtn.textContent = 'Copy URL', 1500);
                    });
                });
                nodes.push(subLink, copyBtn);
            }

            if (slot) nodes.forEach(node => slot.appendChild(node));

            // Prefer the calendar's own name (X-WR-CALNAME) over the filename.
            if (cal.meta && cal.meta.calname) {
                document.getElementById('title').textContent = cal.meta.calname;
                document.title = cal.meta.calname + ' - View';
            }
        });
    }


    // ==========================================================
    // TOML Renderer
    // ==========================================================

    // A TOML file carries no schema, so nothing here knows what any key
    // means: the render is driven entirely by the shape the format itself
    // defines. Scalars become a field grid, sub-tables become nested
    // sections, and a table array becomes an actual table when its entries
    // line up in columns. Everything is read off the typed tree toml.js
    // returns, so a number is displayed as it was written — 1500.00 stays
    // 1500.00, and 0xDEAD stays hexadecimal.
    function renderToml(text) {
        let root;
        try {
            root = TOML.parse(text, { typed: true });
        } catch (e) {
            showMessage('Could not parse <code>' + escHtml(name) + '</code>.<br>' + escHtml(e.message));
            return;
        }

        const toolbar = document.getElementById('toolbar');
        toolbar.style.display = 'flex';
        document.getElementById('title').textContent = name;

        const content = document.getElementById('content');
        content.innerHTML = '';
        content.className = 'toml-view';
        renderTomlTable(root, content, 2);
        addTomlFilter(toolbar, content);
    }

    // Render one table: its own scalar keys first, then a section per
    // sub-table. Key order is document order — TOML tables are ordered by
    // where the author wrote them, and an author's order is information.
    function renderTomlTable(table, container, level) {
        const fields = [];
        const blocks = [];
        table.value.forEach(function (v, k) {
            if (v.type === 'table' && !v.inline) blocks.push([k, v]);
            else if (v.type === 'array' && v.value.length && v.value.every(isTomlTable)) blocks.push([k, v]);
            else fields.push([k, v]);
        });

        if (fields.length) container.appendChild(tomlFields(fields));

        blocks.forEach(function (pair) {
            const section = el('section', 'toml-section');
            section.appendChild(tomlHeading(pair[0], level));
            const next = Math.min(level + 1, 6);
            if (pair[1].type === 'table') renderTomlTable(pair[1], section, next);
            else renderTomlEntries(pair[0], pair[1].value, section, next);
            container.appendChild(section);
        });
    }

    function isTomlTable(node) { return node.type === 'table'; }

    function tomlHeading(text, level) {
        const h = el('h' + level);
        h.textContent = text;
        return h;
    }

    function tomlFields(pairs) {
        const dl = el('dl', 'toml-fields');
        pairs.forEach(function (pair) {
            const dt = el('dt');
            dt.textContent = pair[0];
            const dd = el('dd');
            dd.appendChild(tomlValue(pair[1]));
            dl.appendChild(dt);
            dl.appendChild(dd);
        });
        return dl;
    }

    // A table array is the one shape that reads better as a grid than as a
    // list — it is the repeated-record case, which is exactly what a table
    // is for. When the entries are too deep to line up, they fall back to a
    // section each rather than a table with unreadable cells.
    function renderTomlEntries(key, entries, container, level) {
        if (tomlIsColumnar(entries)) {
            container.appendChild(tomlEntriesTable(entries));
            return;
        }
        entries.forEach(function (entry, i) {
            const section = el('section', 'toml-section');
            section.appendChild(tomlHeading(key + ' ' + (i + 1), level));
            renderTomlTable(entry, section, Math.min(level + 1, 6));
            container.appendChild(section);
        });
    }

    // Columns only work when the entries actually line up: more than one of
    // them, every value flat, and few enough keys to read across a row.
    function tomlIsColumnar(entries) {
        if (entries.length < 2) return false;
        const seen = {};
        let columns = 0;
        for (let i = 0; i < entries.length; i++) {
            let flat = true;
            entries[i].value.forEach(function (v, k) {
                if (!Object.prototype.hasOwnProperty.call(seen, k)) { seen[k] = true; columns++; }
                if (v.type === 'table' && !v.inline) flat = false;
                else if (v.type === 'array' && v.value.some(isTomlTable)) flat = false;
                else if (v.type === 'string' && v.value.indexOf('\n') >= 0) flat = false;
            });
            if (!flat) return false;
        }
        return columns > 0 && columns <= 12;
    }

    function tomlEntriesTable(entries) {
        const columns = [];
        entries.forEach(function (entry) {
            entry.value.forEach(function (v, k) {
                if (columns.indexOf(k) < 0) columns.push(k);
            });
        });

        const table = el('table', 'toml-table');
        const headRow = el('tr');
        columns.forEach(function (c) {
            const th = el('th');
            th.textContent = c;
            headRow.appendChild(th);
        });
        const thead = el('thead');
        thead.appendChild(headRow);
        table.appendChild(thead);

        const tbody = el('tbody');
        entries.forEach(function (entry) {
            const tr = el('tr');
            columns.forEach(function (c) {
                const td = el('td');
                const v = entry.value.get(c);
                // A key absent from this entry is not the same as a key set
                // to an empty value, so it reads as a gap, not a blank.
                td.appendChild(v === undefined ? tomlMuted('—') : tomlValue(v));
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
        table.appendChild(tbody);

        const wrap = el('div', 'toml-table-wrap');
        wrap.appendChild(table);
        return wrap;
    }

    // --- values ---

    function tomlValue(node) {
        switch (node.type) {
            case 'string':  return tomlStringValue(node.value);
            case 'integer':
            case 'float':   return tomlSpan('toml-num', node.raw);
            case 'boolean': return tomlSpan('toml-bool' + (node.value ? ' is-true' : ''), node.raw);
            case 'array':   return tomlArrayValue(node);
            case 'table':   return tomlInlineTableValue(node);
            default:        return tomlDateValue(node);
        }
    }

    function tomlSpan(cls, text) {
        const s = el('span', cls);
        s.textContent = text;
        return s;
    }

    function tomlMuted(text) { return tomlSpan('toml-empty', text); }

    // The constants these use are declared above the dispatch, not here,
    // because the baked path renders synchronously — see the note there.

    // A string earns a link when it is one: an http(s)/mailto URL, or a
    // relative path to something a browser can open. The scheme test is a
    // whitelist, not a javascript:/data: blacklist, because a document is
    // untrusted input. Resolution is relative to the document rather than
    // to the viewer, so a file that lists the records it describes becomes
    // navigable — most of the difference between a metadata dump and a
    // finding aid.
    function tomlLinkTarget(s) {
        if (TOML_LINK_SCHEME.test(s)) return s;
        if (TOML_ANY_SCHEME.test(s)) return null;
        // A contact address is written as an address, not as a mailto: URL.
        if (TOML_EMAIL.test(s)) return 'mailto:' + s;
        if (/[\s?#]/.test(s) || !TOML_DOC_EXT.test(s)) return null;
        try {
            return new URL(s, fetchUrl ? new URL(fetchUrl, location.href) : location.href).href;
        } catch (e) {
            return null;
        }
    }

    function tomlStringValue(s) {
        if (s === '') return tomlMuted('""');
        if (s.indexOf('\n') >= 0) {
            // A multi-line string is prose the author laid out; keep the
            // line breaks they wrote.
            const p = el('div', 'toml-prose');
            p.textContent = s;
            return p;
        }
        const href = tomlLinkTarget(s);
        if (!href) return tomlSpan('', s);
        const a = el('a');
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = s;
        return a;
    }

    function tomlArrayValue(node) {
        const items = node.value;
        if (!items.length) return tomlMuted('—');
        const flat = items.every(function (v) {
            return v.type !== 'table' && v.type !== 'array' &&
                   !(v.type === 'string' && v.value.indexOf('\n') >= 0);
        });
        if (flat && items.length <= 4) {
            const span = el('span');
            items.forEach(function (v, i) {
                if (i) span.appendChild(document.createTextNode(', '));
                span.appendChild(tomlValue(v));
            });
            return span;
        }
        const ul = el('ul', 'toml-list');
        items.forEach(function (v) {
            const li = el('li');
            li.appendChild(tomlValue(v));
            ul.appendChild(li);
        });
        return ul;
    }

    function tomlInlineTableValue(node) {
        const pairs = [];
        node.value.forEach(function (v, k) { pairs.push([k, v]); });
        return pairs.length ? tomlFields(pairs) : tomlMuted('—');
    }

    // Dates render in a form a reader parses at a glance, in a <time> so the
    // machine-readable literal survives in the markup. The offset is shown
    // as written and never converted to the reader's zone: a document states
    // the time it states, and TOML's three local types deliberately carry no
    // zone at all to convert from.
    function tomlDateValue(node) {
        const t = el('time', 'toml-date');
        t.setAttribute('datetime', node.raw);
        t.title = node.raw;
        t.textContent = tomlHumanTemporal(node);
        return t;
    }

    function tomlHumanTemporal(node) {
        if (node.type === 'time-local') return node.raw;
        const m = /^(\d{4})-(\d{2})-(\d{2})(?:[Tt ](\d{2}):(\d{2}):(\d{2})(?:\.\d+)?(.*))?$/.exec(node.raw);
        if (!m) return node.raw;
        const date = String(+m[3]) + ' ' + TOML_MONTHS[+m[2] - 1] + ' ' + m[1];
        if (!m[4]) return date;
        let time = m[4] + ':' + m[5];
        if (m[6] !== '00') time += ':' + m[6];
        const offset = (m[7] || '').trim();
        const zone = /^[Zz]$/.test(offset) ? ' UTC' : (offset ? ' UTC' + offset : '');
        return date + ' at ' + time + zone;
    }

    // --- filter ---

    // A long metadata file is a lot of scrolling, and a finding aid is only
    // as good as its lookup. Hiding what doesn't match beats highlighting
    // what does, because the answer ends up on one screen. A section whose
    // own heading matches keeps all of its contents, so filtering by a
    // section's name shows that section whole.
    function addTomlFilter(toolbar, content) {
        const input = el('input', 'toml-filter');
        input.type = 'search';
        input.placeholder = 'Filter';
        input.setAttribute('aria-label', 'Filter this document');
        input.addEventListener('input', function () {
            filterTomlScope(content, input.value.trim().toLowerCase(), false);
        });
        const toggle = toolbar.querySelector('.theme-toggle');
        toolbar.insertBefore(el('span', 'separator'), toggle);
        toolbar.insertBefore(input, toggle);
    }

    // Returns whether anything in this scope survived. `force` is set once
    // an ancestor heading has matched, which keeps its whole subtree.
    function filterTomlScope(scope, q, force) {
        let any = force || !q;

        scope.querySelectorAll(':scope > .toml-fields').forEach(function (dl) {
            const kids = dl.children;
            for (let i = 0; i + 1 < kids.length; i += 2) {
                const dt = kids[i], dd = kids[i + 1];
                const hit = !q || force ||
                    (dt.textContent + ' ' + dd.textContent).toLowerCase().indexOf(q) >= 0;
                dt.style.display = hit ? '' : 'none';
                dd.style.display = hit ? '' : 'none';
                if (hit) any = true;
            }
        });

        scope.querySelectorAll(':scope > .toml-table-wrap').forEach(function (wrap) {
            let shown = 0;
            wrap.querySelectorAll('tbody > tr').forEach(function (tr) {
                const hit = !q || force || tr.textContent.toLowerCase().indexOf(q) >= 0;
                tr.style.display = hit ? '' : 'none';
                if (hit) shown++;
            });
            wrap.style.display = shown ? '' : 'none';
            if (shown) any = true;
        });

        scope.querySelectorAll(':scope > .toml-section').forEach(function (section) {
            const heading = section.querySelector(':scope > h2, :scope > h3, :scope > h4, :scope > h5, :scope > h6');
            const headingHit = !!q && !!heading && heading.textContent.toLowerCase().indexOf(q) >= 0;
            const inner = filterTomlScope(section, q, force || headingHit);
            const visible = !q || force || headingHit || inner;
            section.style.display = visible ? '' : 'none';
            if (visible) any = true;
        });

        return any;
    }


    // ==========================================================
    // DocLang Renderer
    // ==========================================================

    // A DocLang file (doclang.ai) is XML whose vocabulary already says what
    // each part of a document is — heading, paragraph, list, OTSL table,
    // picture, code — so the render is a mapping from that vocabulary onto
    // the HTML element with the same meaning, and the base styles do the
    // rest. The browser's own XML parser reads the file, and every node
    // here is built with createElement and text nodes, never innerHTML, so
    // like TOML the document cannot contribute markup and needs no
    // sanitizer. Geometry (<location>) is information for a review tool,
    // not for a reader, and is ignored.
    function renderDoclang(text) {
        const xml = new DOMParser().parseFromString(text, 'application/xml');
        const parseError = xml.getElementsByTagName('parsererror')[0];
        if (parseError) {
            showMessage('Could not parse <code>' + escHtml(name) + '</code>.<br>' + escHtml(dclgText(parseError)));
            return;
        }
        const root = xml.documentElement;
        if (root.localName !== 'doclang') {
            showMessage('<code>' + escHtml(name) + '</code> is XML, but its root element is <code>&lt;' +
                        escHtml(root.localName) + '&gt;</code>, not <code>&lt;doclang&gt;</code>.');
            return;
        }

        const toolbar = document.getElementById('toolbar');
        toolbar.style.display = 'flex';
        document.getElementById('title').textContent = name;

        const content = document.getElementById('content');
        content.innerHTML = '';
        content.className = 'dclg-view';
        const ctx = { threads: new Map(), pages: 1, furniture: false };
        dclgNodes(root.childNodes, content, ctx, false);

        const version = root.getAttribute('version') || '0.7';
        document.getElementById('info').textContent =
            (ctx.pages > 1 ? ctx.pages + ' pages · ' : '') + 'DocLang ' + version;
        if (ctx.furniture) addDclgFurnitureToggle(toolbar, content);
    }

    // Render a run of XML nodes into `container`. In inline context (inside
    // a paragraph) text and formatting flow together; in block context each
    // semantic element becomes a block and whitespace between them is
    // dropped. Raw text is kept in both, because a list item or a table
    // cell may be a "virtual <text>": unwrapped text the spec says to treat
    // as if it were a paragraph.
    function dclgNodes(nodes, container, ctx, inline) {
        Array.prototype.forEach.call(nodes, function (node) {
            if (node.nodeType === 3 || node.nodeType === 4) {   // text, CDATA
                if (!inline && !node.nodeValue.trim()) return;
                container.appendChild(document.createTextNode(node.nodeValue));
                return;
            }
            if (node.nodeType !== 1) return;   // comments, processing instructions
            const tag = node.localName;
            if (DCLG_PROPERTIES.has(tag) || tag === 'head') return;   // element head: the host consumed it
            if (DCLG_FORMATTING[tag]) {
                const e = el(DCLG_FORMATTING[tag]);
                dclgNodes(node.childNodes, e, ctx, true);
                container.appendChild(e);
                return;
            }
            switch (tag) {
                case 'content':
                case 'handwriting': {
                    const e = el('span', 'dclg-' + tag);
                    dclgNodes(node.childNodes, e, ctx, true);
                    container.appendChild(e);
                    return;
                }
                case 'rtl': {
                    const e = el('span');
                    e.dir = 'rtl';
                    dclgNodes(node.childNodes, e, ctx, true);
                    container.appendChild(e);
                    return;
                }
                case 'checkbox': {
                    const selected = node.getAttribute('class') === 'selected';
                    const e = el('span', 'dclg-checkbox');
                    e.textContent = selected ? '☑' : '☐';
                    e.setAttribute('role', 'img');
                    e.setAttribute('aria-label', selected ? 'checked' : 'unchecked');
                    container.appendChild(e);
                    return;
                }
                case 'page_break': {
                    ctx.pages += 1;
                    const e = el('div', 'dclg-page-break');
                    e.textContent = 'Page ' + ctx.pages;
                    container.appendChild(e);
                    return;
                }
                default:
                    dclgElement(node, container, ctx, inline);
            }
        });
    }

    // One semantic element. Its head is read first; then, if it continues
    // a thread another fragment started, its body flows into that block —
    // a paragraph split by a page break reads as one paragraph, a list
    // split across pages is one list. Otherwise it becomes a block (or an
    // inline run, when nested in a paragraph), framed by its caption.
    function dclgElement(node, container, ctx, inline) {
        const tag = node.localName;
        const head = dclgHead(node);
        const body = dclgBody(node);
        if (tag === 'page_header' || tag === 'page_footer') head.furniture = true;

        const thread = head.thread ? ctx.threads.get(head.thread) : null;
        if (thread && thread.tag === tag && !inline && dclgContinue(tag, thread.el, head, body, ctx)) return;

        const e = dclgBuild(tag, node, head, body, ctx, inline);
        if (head.thread && !thread) {
            e.id = dclgThreadId(head.thread);
            ctx.threads.set(head.thread, { tag: tag, el: e });
        }
        const outer = inline ? e : dclgFrame(e, tag, head, ctx);
        if (head.furniture) {
            outer.classList.add('dclg-furniture');
            ctx.furniture = true;
        }
